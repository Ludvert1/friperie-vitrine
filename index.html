    return sb.storage.from("market").getPublicUrl(path).data.publicUrl;
  }

async function compress(file, max, q){
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth*r); c.height = Math.round(img.naturalHeight*r); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", q)); } finally { URL.revokeObjectURL(url); }
}

    const mrr = live.reduce((a,s)=>a+(s.plan==="premium"?S.price_premium:S.price_basic),0);
    const m0 = new Date(); m0.setDate(1); m0.setHours(0,0,0,0);
    const monthRev = pays.filter(p=>p.status==="approved" && new Date(p.approved_at||p.created_at) >= m0).reduce((a,p)=>a+p.amount,0);
    const totalRev = pays.filter(p=>p.status==="approved").reduce((a,p)=>a+p.amount,0);
    const soon = shops.filter(s => s.status==="active" && s.paid_until && (new Date(s.paid_until)-Date.now()) < 7*DAY).sort((a,b)=>new Date(a.paid_until)-new Date(b.paid_until));
    box.innerHTML = `<div class="kpis"><div class="kpi"><div class="l">${L("Boutiques en ligne","Live shops")}</div><div class="v">${live.length}</div></div><div class="kpi"><div class="l">Premium</div><div class="v">${premLive.length}</div></div>
      <div class="kpi ${pendShops.length?"al":""}"><div class="l">${L("À valider","To review")}</div><div class="v">${pendShops.length}</div></div><div class="kpi ${pendPays.length?"al":""}"><div class="l">${L("Paiements à vérifier","Payments to verify")}</div><div class="v">${pendPays.length}</div></div>
      <div class="kpi"><div class="l">${L("Revenu mensuel récurrent","Monthly recurring revenue")}</div><div class="v" style="font-size:19px">${money(mrr)}</div></div><div class="kpi"><div class="l">${L("Encaissé ce mois","Collected this month")}</div><div class="v" style="font-size:19px">${money(monthRev)}</div></div><div class="kpi"><div class="l">${L("Encaissé total","Total collected")}</div><div class="v" style="font-size:19px">${money(totalRev)}</div></div></div>
      <div class="two"><div class="panel"><h3>${L("Expirent bientôt (relancer)","Expiring soon (follow up)")}</h3>${soon.length?soon.map(s=>`<div class="kv"><b>${fmtD(s.paid_until)}</b><span>${esc(s.name)} · ${s.plan}</span><a style="margin-left:auto" class="btn wa sm" target="_blank" rel="noopener" href="${wa(s.whatsapp, L(`Bonjour ${s.name}, votre abonnement ${CONFIG.PLATFORM_NAME} expire le ${fmtD(s.paid_until)}. Renouvelez depuis votre espace commerçant pour rester visible.`,`Hello ${s.name}, your ${CONFIG.PLATFORM_NAME} subscription expires on ${fmtD(s.paid_until)}. Renew from your merchant space to stay visible.`))}">${L("Relancer","Remind")}</a></div>`).join(""):`<p class="note">${L("Rien à signaler.","Nothing to report.")}</p>`}</div>
      <div class="panel"><h3>${L("Boutiques les plus vues","Most viewed shops")}</h3>${[...shops].sort((a,b)=>b.views-a.views).slice(0,6).map(s=>`<div class="kv"><b>${s.views} 👁</b>${esc(s.name)} <span class="note" style="margin-left:auto">${s.wa_clicks} WhatsApp</span></div>`).join("")}</div></div>`;
  }
  if (AT === "shops") {
    const f = { all:()=>true, pending:s=>s.status==="pending", live:s=>visible(s,S), premium:s=>s.plan==="premium", expired:s=>s.status==="active"&&!visible(s,S), suspended:s=>s.status==="suspended" };
    const lab = { all:L("Toutes","All"), pending:L("À valider","To review"), live:L("En ligne","Live"), premium:"Premium", expired:L("Expirées","Expired"), suspended:L("Suspendues","Suspended") };
    const list = shops.filter(f[AF]);
    box.innerHTML = `<div class="chips">${Object.keys(f).map(k=>`<button class="chip ${AF===k?"on":""}" data-af="${k}">${lab[k]} (${shops.filter(f[k]).length})</button>`).join("")}</div>
      <div class="tsc"><table class="t"><tr><th></th><th>${L("Boutique","Shop")}</th><th>${L("Offre","Plan")}</th><th>${L("Jusqu'au","Until")}</th><th>${L("Statut","Status")}</th><th>${L("Stats","Stats")}</th><th></th></tr>
      ${list.map(s=>`<tr><td><img class="mini" src="${esc(shopLogo(s))}"></td><td><b>${esc(s.name)}</b> ${s.verified?`<span class="vchk">✓</span>`:""}<div class="note">${esc(catName(s.category))} · ${esc(s.city)} · ${esc(s.whatsapp||"")}</div></td>
        <td>${s.plan==="premium"?"★ Premium":L("Essentiel","Basic")}${s.plan==="premium"?`<div class="note">${L("ordre","order")} ${s.spotlight_order||"—"}</div>`:""}</td><td>${fmtD(s.paid_until)}</td>
        <td><span class="st ${s.status==="active"&&!visible(s,S)?"expired":s.status}">${s.status==="active"&&!visible(s,S)?L("expirée","expired"):s.status}</span></td><td class="note">${s.views}👁 ${s.wa_clicks}💬</td>
        <td style="white-space:nowrap"><a class="btn line sm" href="#s-${esc(s.slug)}">${L("Voir","View")}</a> <button class="btn ${s.status==="pending"?"pri":"line"} sm" data-sa="${s.id}">${L("Gérer","Manage")}</button></td></tr>`).join("") || `<tr><td colspan="7" class="note">—</td></tr>`}</table></div>`;
    $$("[data-af]").forEach(b => b.onclick = () => { AF = b.dataset.af; pageAdmin(v); });
    $$("[data-sa]").forEach(b => b.onclick = () => { const s = shops.find(x=>x.id===b.dataset.sa);
      const ov = modal(`<div class="mb"><h3>${esc(s.name)}</h3><p class="note">${esc(dsc(s))}</p>
        <div class="r2"><label class="f"><span>${L("Statut","Status")}</span><select class="in" id="xs">${["pending","active","suspended"].map(x=>`<option ${s.status===x?"selected":""}>${x}</option>`).join("")}</select></label><label class="f"><span>${L("Offre","Plan")}</span><select class="in" id="xp"><option value="basic">${L("Essentiel","Basic")}</option><option value="premium" ${s.plan==="premium"?"selected":""}>Premium</option></select></label></div>
        <div class="r2"><label class="f"><span>${L("Abonnement jusqu'au","Subscription until")}</span><input class="in" type="date" id="xu" value="${s.paid_until?new Date(s.paid_until).toISOString().slice(0,10):""}"></label><label class="f"><span>${L("Ordre dans la bannière (Premium)","Banner order (Premium)")}</span><input class="in" type="number" id="xo" value="${s.spotlight_order||0}"></label></div>
        <label style="display:flex;gap:8px;margin-bottom:14px"><input type="checkbox" id="xv" ${s.verified?"checked":""}> ${L("Badge « Boutique vérifiée » (identité et adresse contrôlées)","\"Verified shop\" badge (identity and address checked)")}</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="xsv">${L("Enregistrer","Save")}</button>${s.status==="pending"?`<button class="btn acc" id="xap">✓ ${L("Approuver et publier","Approve & publish")}</button>`:""}<a class="btn wa" target="_blank" rel="noopener" href="${wa(s.whatsapp,"")}">WhatsApp</a></div></div>`, true);
      const save = async patch => { try { await API.adminShop(s.id, patch); closeModal(); toast(L("Enregistré ✓","Saved ✓")); refresh(); } catch(err){ toast(err.message||"Erreur"); } };
      $("#xsv",ov).onclick = () => save({ status:$("#xs",ov).value, plan:$("#xp",ov).value, paid_until: $("#xu",ov).value ? new Date($("#xu",ov).value+"T23:59:00").toISOString() : null, spotlight_order:+$("#xo",ov).value||0, verified:$("#xv",ov).checked });
      const ap = $("#xap",ov); if (ap) ap.onclick = () => save({ status:"active", verified:$("#xv",ov).checked }); });
  }
  if (AT === "pays") {
    box.innerHTML = `<div class="tsc"><table class="t"><tr><th>Date</th><th>${L("Boutique","Shop")}</th><th>${L("Offre","Plan")}</th><th>${L("Montant","Amount")}</th><th>MoMo</th><th>${L("Statut","Status")}</th><th></th></tr>
      ${pays.map(p=>`<tr><td>${fmtD(p.created_at)}</td><td><b>${esc(shopName(p.shop_id))}</b></td><td>${p.plan} · ${p.months} ${L("mois","mo")}</td><td><b>${money(p.amount)}</b></td><td class="note">${esc(p.momo_txn)}<br>${esc(p.momo_sender)}</td><td><span class="st ${p.status}">${p.status}</span></td>
      <td style="white-space:nowrap">${p.status==="pending"?`<button class="btn pri sm" data-ok="${p.id}">✓ ${L("Valider","Approve")}</button> <button class="btn red sm" data-no="${p.id}">✕</button>`:""}</td></tr>`).join("") || `<tr><td colspan="7" class="note">—</td></tr>`}</table></div>
      <p class="note">${L("Vérifiez chaque ID de transaction dans votre application MoMo avant de valider. La validation prolonge l'abonnement et publie la boutique.","Check each transaction ID in your MoMo app before approving. Approval extends the subscription and publishes the shop.")}</p>`;
    $$("[data-ok]").forEach(b => b.onclick = async () => { if (await ask(L("Confirmer que ce paiement MoMo a bien été reçu ?","Confirm this MoMo payment was received?"), L("Valider","Approve"))) { await API.approvePayment(b.dataset.ok); toast(L("Abonnement activé ✓","Subscription activated ✓")); refresh(); } });
    $$("[data-no]").forEach(b => b.onclick = async () => { if (await ask(L("Rejeter ce paiement ?","Reject this payment?"), L("Rejeter","Reject"))) { await API.rejectPayment(b.dataset.no); refresh(); } });
  }
  if (AT === "revs") {
    box.innerHTML = `<div class="tsc"><table class="t"><tr><th>Date</th><th>${L("Boutique","Shop")}</th><th>${L("Avis","Review")}</th><th></th></tr>${revs.map(r=>`<tr><td>${fmtD(r.created_at)}</td><td>${esc(shopName(r.shop_id))}</td><td><b>${esc(r.name)}</b> ${"★".repeat(r.rating)}<div>${esc(r.comment)}</div></td><td><button class="btn ${r.status==="visible"?"red":"line"} sm" data-rv="${r.id}" data-to="${r.status==="visible"?"hidden":"visible"}">${r.status==="visible"?L("Masquer","Hide"):L("Afficher","Show")}</button></td></tr>`).join("")}</table></div>`;
    $$("[data-rv]").forEach(b => b.onclick = async () => { await API.setReview(b.dataset.rv, b.dataset.to); refresh(); });
  }
  if (AT === "set") {
    const fld = (k, l, t="text") => `<label class="f"><span>${l}</span><input class="in" name="${k}" type="${t}" value="${esc(S[k]??"")}"></label>`;
    box.innerHTML = `<form class="panel" id="stf" style="max-width:820px"><h3>${L("Paiement des abonnements","Subscription payments")}</h3><div class="r2">${fld("momo_number",L("Numéro MTN MoMo de la plateforme","Platform MTN MoMo number"))}${fld("momo_name",L("Nom du compte MoMo","MoMo account name"))}</div>
      <div class="r2">${fld("support_whatsapp",L("WhatsApp support (format 229…)","Support WhatsApp (229… format)"))}${fld("support_email","Email support")}</div>
      <h3>${L("Tarifs (FCFA / mois)","Pricing (FCFA / month)")}</h3><div class="r2">${fld("price_basic",L("Essentiel","Basic"),"number")}${fld("price_premium","Premium","number")}</div>
      <div class="r2">${fld("trial_days",L("Jours d'essai gratuit (0 = aucun)","Free trial days (0 = none)"),"number")}${fld("grace_days",L("Jours de grâce après expiration","Grace days after expiry"),"number")}</div>
      <h3>${L("Limites","Limits")}</h3><div class="r2">${fld("max_products_basic",L("Produits — Essentiel","Products — Basic"),"number")}${fld("max_products_premium",L("Produits — Premium","Products — Premium"),"number")}</div><div class="r2">${fld("max_gallery_basic",L("Photos galerie — Essentiel","Gallery photos — Basic"),"number")}${fld("max_gallery_premium",L("Photos galerie — Premium","Gallery photos — Premium"),"number")}</div>
      <button class="btn pri">${L("Enregistrer","Save")}</button></form>`;
    $("#stf").onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); ["price_basic","price_premium","trial_days","grace_days","max_products_basic","max_products_premium","max_gallery_basic","max_gallery_premium"].forEach(k => f[k] = +f[k]||0);
      try { await API.saveSettings({ ...S, ...f }); S = await API.settings(); toast(L("Paramètres enregistrés ✓","Settings saved ✓")); } catch(err){ toast(err.message||"Erreur"); } };
  }
}

/* =====================================================================
   ROUTER / BOOT
   ===================================================================== */
async function reloadData(){ [S, SHOPS, PRODS] = await Promise.all([API.settings(), API.shops(), API.allProducts()]); }
/* in-page router: works even where the browser blocks #-link jumps (previews, app viewers) */
let CUR = "home";
function baseUrl(){ try { return location.href.split("#")[0]; } catch(e){ return ""; } }
function curHash(){ try { return location.hash.slice(1); } catch(e){ return ""; } }
function go(h){ h = String(h||"home").replace(/^#/,"") || "home"; CUR = h; try { if (curHash() !== h) history.pushState(null, "", "#" + h); } catch(e){} route(h); }
async function route(hh){
  const h = (typeof hh === "string" && hh) ? hh : (curHash() || CUR || "home"); CUR = h; const v = $("#view");
  if (h === "how") { if (!$("#how")) { await render("home"); } chrome("home"); setTimeout(()=>$("#how")?.scrollIntoView({behavior:"smooth"}), 50); return; }
  await render(h);
}
async function render(h){
  const v = $("#view"); closeModal(); v.onclick = null;
  chrome(h.startsWith("s-") ? "shops" : h); $("#nav").classList.remove("open"); window.scrollTo(0,0);
  if (h === "home") pageHome(v);
  else if (h === "shops") pageShops(v);
  else if (h === "favorites") pageShops(v, true);
  else if (h.startsWith("s-")) await pageShop(v, h.slice(2));
  else if (h === "join") pageJoin(v);
  else if (h === "signup") pageSignup(v);
  else if (h === "login") pageLogin(v);
  else if (h === "merchant") await pageMerchant(v);
  else if (h === "admin") await pageAdmin(v);
  else pageHome(v);
}
document.addEventListener("click", e => {
  const lb = e.target.closest(".lang button"); if (lb) { lang = lb.dataset.lang; store.set("vt_lang", lang); route(CUR); return; }
  const fv = e.target.closest("[data-fav]"); if (fv) { e.preventDefault(); e.stopPropagation(); toggleFav(fv.dataset.fav); fv.textContent = isFav(fv.dataset.fav) ? "❤️" : "🤍"; chrome(CUR); return; }
  const pc = e.target.closest("[data-prod]"); if (pc) { openProduct(pc.dataset.prod); return; }
  const gc = e.target.closest("[data-gocat]"); if (gc) { FILT = { q:"", cat:gc.dataset.gocat, city:"", sort:"rec", ver:false }; }
}, true);
document.addEventListener("error", e => { const im = e.target; if (im && im.tagName === "IMG" && im.dataset.fb) { const f = im.dataset.fb; delete im.dataset.fb; im.src = f; } }, true);

/* form shim: run form handlers from button clicks / Enter, even where form submission is blocked */
function runForm(form){ if (!form || typeof form.onsubmit !== "function") return false; if (form.reportValidity && !form.reportValidity()) return true; form.onsubmit({ preventDefault(){}, target: form, currentTarget: form }); return true; }
document.addEventListener("click", e => {
  const btn = e.target.closest("button, input[type=submit]"); if (!btn) return;
  const form = btn.form || btn.closest("form"); if (!form) return;
  const type = (btn.getAttribute("type") || "submit").toLowerCase(); if (type !== "submit") return;
  e.preventDefault(); if (btn.disabled) return; runForm(form);
}, true);
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return; const el = e.target;
  if (!el || el.tagName !== "INPUT" || ["checkbox","radio","file","button","submit"].includes(el.type)) return;
  const form = el.form || el.closest("form"); if (!form || typeof form.onsubmit !== "function") return;
  e.preventDefault(); runForm(form);
}, true);
$("#burger").onclick = () => $("#nav").classList.toggle("open");
window.addEventListener("hashchange", () => { const h = curHash() || "home"; if (h !== CUR) route(h); });
window.addEventListener("popstate", () => { const h = curHash() || "home"; if (h !== CUR) route(h); });
document.addEventListener("click", e => {
  if (e.defaultPrevented) return;
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  e.preventDefault(); go(a.getAttribute("href").slice(1));
});
(async function boot(){
  if (!LIVE) { $("#demoBar").textContent = L("Mode démo — les données sont enregistrées dans ce navigateur. Commerçant : vetu@demo.bj / demo · Admin : admin@vitrine.demo / demo","Demo mode — data is saved in this browser. Merchant: vetu@demo.bj / demo · Admin: admin@vitrine.demo / demo"); $("#demoBar").classList.remove("hidden"); }
  $("#view").innerHTML = `<div class="wrap" style="padding:80px 18px;text-align:center"><span class="spin"></span></div>`;
  try { await API.init(); ME = await API.session(); await reloadData(); } catch(e){ console.error(e); toast("Erreur de connexion / Connection error"); }
  if (LIVE) sb.auth.onAuthStateChange(async () => { ME = await API.session(); });
  route();
})();
</script>
